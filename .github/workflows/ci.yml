name: CareerPilot AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (143 Tests & 87% Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Pytest with Statement Coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=term-missing

  frontend-tests:
    name: Frontend Test Suite (34 Tests & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck (0 Errors Gate)
        run: |
          cd frontend
          npm run typecheck

      - name: Run Vitest Suite
        run: |
          cd frontend
          npm test -- --run

      - name: Production Bundle Build Verification
        run: |
          cd frontend
          npm run build
