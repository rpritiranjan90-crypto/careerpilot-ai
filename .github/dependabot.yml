# GitHub Dependabot configuration
# Keep dependencies up-to-date automatically and surface vulnerabilities early.

version: 2

updates:
  # Python (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(backend)"
    labels:
      - "dependencies"
      - "backend"
      - "security"
    open-pull-requests-limit: 5
    # Group security patches separately so they land fast without waiting
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    # Auto-merge minor/patch; review major versions manually
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Node (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - "dependencies"
      - "frontend"
      - "security"
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns: ["*"]

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
    commit-message:
      prefix: "docker(backend)"
    labels:
      - "dependencies"
      - "docker"
      - "security"
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "tuesday"
    commit-message:
      prefix: "docker(frontend)"
    labels:
      - "dependencies"
      - "docker"
      - "security"
