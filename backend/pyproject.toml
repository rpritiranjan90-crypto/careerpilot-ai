[project]
name = "career-pilot-ai-backend"
version = "1.0.0"
description = "CareerPilot AI - Prepare smarter. Get career-ready."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.7",
    "python-dotenv>=1.0.1",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "black>=24.3.0",
    "mypy>=1.7.0",
    "pip-audit>=2.7.0",
    "testcontainers[postgres]>=4.7.0",
]

[project.scripts]
# Console script entries (must be module:func form, not shell commands).
# Helper shell commands live in scripts/ instead.

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "alembic*"]

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ISC"]
# B008: function-call-in-default-argument — required by FastAPI Depends()
# B904: raise-without-from-inside-except — handled case-by-case where needed
# UP045: `Optional[X]` vs `X | None` — both valid; prefer readability over strict upgrade
ignore = ["E501", "B008", "UP045"]

[tool.black]
target-version = ["py310"]
line-length = 88
indent-width = 4

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
