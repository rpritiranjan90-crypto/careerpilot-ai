global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load alerting rules
rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "careerpilot-backend"
    static_configs:
      - targets: ["careerpilot-backend:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
